name: Refresh VPS price data

on:
  schedule:
    - cron: '37 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vps-price-data-refresh
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and validate canonical exports
        shell: bash
        run: |
          set -euo pipefail
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          for extension in csv json; do
            curl --fail --silent --show-error --location --retry 3 --max-time 60               --proto '=https' --proto-redir '=https'               "https://vpsscouter.com/data/vps-prices.$extension"               --output "$temp_dir/vps-prices.$extension"
          done
          python3 - "$temp_dir" <<'PY'
          import csv
          from collections import Counter
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from xml.sax.saxutils import escape

          staging = Path(sys.argv[1])
          csv_path = staging / 'vps-prices.csv'
          json_path = staging / 'vps-prices.json'
          with csv_path.open(encoding='utf-8-sig', newline='') as source:
              reader = csv.DictReader(source)
              if not {'provider', 'checked_at', 'source_url'} <= set(reader.fieldnames or []):
                  raise ValueError('Missing required CSV columns')
              rows = [row for row in reader if row.get('provider') and row.get('source_url')]
          row_count = len(rows)
          if not row_count:
              raise ValueError('The CSV export contains no plan rows')
          with json_path.open(encoding='utf-8-sig') as source:
              payload = json.load(source)
          if not isinstance(payload, (dict, list)) or not payload:
              raise ValueError('Expected a nonempty JSON object or array')

          providers = Counter(row['provider'] for row in rows)
          top = sorted(providers.items(), key=lambda item: (-item[1], item[0]))[:10]
          scale = 360 / top[0][1]
          height = 90 + 28 * len(top)
          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="690" height="{height}" viewBox="0 0 690 {height}" role="img" aria-labelledby="title description">',
              '<title id="title">VPS plans by provider</title>',
              '<desc id="description">The ten providers with the most plans in this snapshot.</desc>',
              f'<rect width="690" height="{height}" rx="12" fill="#f4f7fb"/>',
              '<g font-family="system-ui, sans-serif" fill="#182338">',
              '<text x="24" y="34" font-size="22" font-weight="700">VPS plans by provider</text>',
              f'<text x="24" y="57" font-size="13">Top 10 by plan count · {row_count} plans from {len(providers)} providers</text>',
          ]
          for index, (provider, count) in enumerate(top):
              y = 74 + 28 * index
              width = count * scale
              svg.append(f'<text x="24" y="{y + 14}" font-size="14">{escape(provider)}</text>')
              svg.append(f'<rect x="244" y="{y}" width="{width:.1f}" height="18" rx="4" fill="#235cba"/>')
              svg.append(f'<text x="{252 + width:.1f}" y="{y + 14}" font-size="14">{count}</text>')
          svg.extend(['</g>', '</svg>'])
          chart = Path('charts/plans-by-provider.svg')
          chart.parent.mkdir(exist_ok=True)
          chart.write_text('\n'.join(svg) + '\n', encoding='utf-8')

          changed = []
          for source in (csv_path, json_path):
              target = Path(source.name)
              data = source.read_bytes()
              if not target.exists() or target.read_bytes() != data:
                  target.write_bytes(data)
                  changed.append(source.name)
          if changed:
              changelog = Path('CHANGELOG.md')
              if not changelog.exists():
                  changelog.write_text('# Mirror changelog\n', encoding='utf-8')
              fetched_at = datetime.now(timezone.utc).isoformat(timespec='seconds')
              with changelog.open('a', encoding='utf-8') as log:
                  log.write(f"\n- {fetched_at}: mirrored {', '.join(changed)} ({row_count} CSV plan rows).\n")
          PY
      - name: Commit changed exports
        shell: bash
        run: |
          set -euo pipefail
          git add vps-prices.csv vps-prices.json CHANGELOG.md charts/plans-by-provider.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh VPS Scouter price data'
          git push
